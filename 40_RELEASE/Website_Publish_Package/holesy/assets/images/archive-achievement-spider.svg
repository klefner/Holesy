<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Archive and Achievement Spider Map</title>
  <desc id="desc">A spider diagram connecting archive groups to documents and the achievements hinted by those documents.</desc>
  <rect width="1400" height="980" fill="#0d1320"/>
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#80fff5" flood-opacity="0.22"/>
    </filter>
    <style>
      .title{font:900 34px Arial,Helvetica,sans-serif;fill:#fff}
      .sub{font:700 15px Arial,Helvetica,sans-serif;fill:#aab5c8}
      .group{font:900 21px Arial,Helvetica,sans-serif;fill:#111827}
      .doc{font:800 13px Arial,Helvetica,sans-serif;fill:#eaf2ff}
      .docSmall{font:700 11px Arial,Helvetica,sans-serif;fill:#9aa6bb}
      .ach{font:900 13px Arial,Helvetica,sans-serif;fill:#151321}
      .achSmall{font:800 10px Arial,Helvetica,sans-serif;fill:#3a2a09}
      .line{stroke:#334155;stroke-width:2.2;fill:none}
      .hintLine{stroke:#ffdd59;stroke-width:2.8;fill:none;stroke-dasharray:6 6}
      .groupLine{stroke:#80fff5;stroke-width:3;fill:none;opacity:.55}
    </style>
  </defs>

  <text x="700" y="58" text-anchor="middle" class="title">ARCHIVE SPIDER MAP</text>
  <text x="700" y="84" text-anchor="middle" class="sub">Recovered documents cluster by thread. Gold links point to known achievement or buff hints.</text>

  <g filter="url(#glow)">
    <circle cx="700" cy="500" r="82" fill="#111827" stroke="#80fff5" stroke-width="4"/>
    <text x="700" y="489" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900" fill="#fff">THE</text>
    <text x="700" y="524" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900" fill="#ffdd59">ARCHIVE</text>
  </g>

  <path class="groupLine" d="M636 450 C480 310 337 250 192 210"/>
  <path class="groupLine" d="M764 450 C925 306 1070 236 1212 196"/>
  <path class="groupLine" d="M700 582 C700 708 700 784 700 872"/>

  <g>
    <rect x="78" y="166" width="226" height="54" rx="16" fill="#80fff5"/>
    <text x="191" y="200" text-anchor="middle" class="group">WITNESSES</text>
    <path class="line" d="M191 220 L191 292"/>
    <path class="line" d="M191 220 L80 300"/>
    <path class="line" d="M191 220 L302 300"/>
    <path class="line" d="M191 220 L66 415"/>
    <path class="line" d="M191 220 L316 415"/>
    <path class="line" d="M191 220 L191 535"/>

    <rect x="98" y="292" width="186" height="50" rx="10" fill="#1c2438" stroke="#475569"/>
    <text x="191" y="312" text-anchor="middle" class="doc">Bus Stop Files</text>
    <text x="191" y="329" text-anchor="middle" class="docSmall">WIT-1 / WIT-2 / WIT-9</text>

    <rect x="0" y="300" width="160" height="58" rx="10" fill="#1c2438" stroke="#ffdd59"/>
    <text x="80" y="322" text-anchor="middle" class="doc">Everyone's Friend</text>
    <text x="80" y="340" text-anchor="middle" class="docSmall">WIT-4</text>
    <path class="hintLine" d="M80 358 C78 390 90 421 120 446"/>
    <rect x="54" y="446" width="132" height="48" rx="22" fill="#ffdd59"/>
    <text x="120" y="467" text-anchor="middle" class="ach">Crowd Magnet</text>
    <text x="120" y="482" text-anchor="middle" class="achSmall">Pedestrian Pull</text>

    <rect x="222" y="300" width="160" height="58" rx="10" fill="#1c2438" stroke="#ffdd59"/>
    <text x="302" y="322" text-anchor="middle" class="doc">hungry_geology</text>
    <text x="302" y="340" text-anchor="middle" class="docSmall">WIT-6 / WIT-7</text>
    <path class="hintLine" d="M302 358 C322 386 340 414 346 446"/>
    <rect x="276" y="446" width="140" height="48" rx="22" fill="#ffdd59"/>
    <text x="346" y="467" text-anchor="middle" class="ach">Forum User</text>
    <text x="346" y="482" text-anchor="middle" class="achSmall">stay small</text>

    <rect x="-8" y="415" width="148" height="58" rx="10" fill="#1c2438" stroke="#ffdd59"/>
    <text x="66" y="437" text-anchor="middle" class="doc">Tree Complaints</text>
    <text x="66" y="455" text-anchor="middle" class="docSmall">WIT-8</text>
    <path class="hintLine" d="M66 473 C53 510 68 540 104 560"/>
    <rect x="50" y="560" width="108" height="48" rx="22" fill="#ffdd59"/>
    <text x="104" y="581" text-anchor="middle" class="ach">Tree Feast</text>
    <text x="104" y="596" text-anchor="middle" class="achSmall">Tree Hugger</text>

    <rect x="240" y="415" width="152" height="58" rx="10" fill="#1c2438" stroke="#475569"/>
    <text x="316" y="437" text-anchor="middle" class="doc">Other Witnesses</text>
    <text x="316" y="455" text-anchor="middle" class="docSmall">no active hint yet</text>

    <rect x="111" y="535" width="160" height="50" rx="10" fill="#1c2438" stroke="#475569"/>
    <text x="191" y="556" text-anchor="middle" class="doc">Modern Vanishings</text>
    <text x="191" y="573" text-anchor="middle" class="docSmall">closure files</text>
  </g>

  <g>
    <rect x="1082" y="152" width="260" height="54" rx="16" fill="#ffdd59"/>
    <text x="1212" y="187" text-anchor="middle" class="group">THE PATTERN</text>
    <path class="line" d="M1212 206 L1092 292"/>
    <path class="line" d="M1212 206 L1212 292"/>
    <path class="line" d="M1212 206 L1322 292"/>
    <path class="line" d="M1212 206 L1110 430"/>
    <path class="line" d="M1212 206 L1296 430"/>

    <rect x="1016" y="292" width="152" height="58" rx="10" fill="#1c2438" stroke="#ffdd59"/>
    <text x="1092" y="314" text-anchor="middle" class="doc">Linden Street</text>
    <text x="1092" y="332" text-anchor="middle" class="docSmall">PAT-4</text>
    <path class="hintLine" d="M1092 350 C1062 386 1048 418 1054 452"/>
    <rect x="978" y="452" width="152" height="48" rx="22" fill="#ffdd59"/>
    <text x="1054" y="473" text-anchor="middle" class="ach">Building Chain</text>
    <text x="1054" y="488" text-anchor="middle" class="achSmall">Linden Street</text>

    <rect x="1136" y="292" width="152" height="58" rx="10" fill="#1c2438" stroke="#ffdd59"/>
    <text x="1212" y="314" text-anchor="middle" class="doc">Thorough Block</text>
    <text x="1212" y="332" text-anchor="middle" class="docSmall">PAT-6</text>
    <path class="hintLine" d="M1212 350 C1200 386 1204 422 1222 452"/>
    <rect x="1156" y="452" width="132" height="48" rx="22" fill="#ffdd59"/>
    <text x="1222" y="473" text-anchor="middle" class="ach">Block Sweep</text>
    <text x="1222" y="488" text-anchor="middle" class="achSmall">Quiet Block</text>

    <rect x="1262" y="292" width="138" height="58" rx="10" fill="#1c2438" stroke="#ffdd59"/>
    <text x="1331" y="314" text-anchor="middle" class="doc">Bellmar Card</text>
    <text x="1331" y="332" text-anchor="middle" class="docSmall">PAT-9</text>
    <path class="hintLine" d="M1331 350 C1354 392 1350 426 1322 452"/>
    <rect x="1266" y="452" width="112" height="48" rx="22" fill="#ffdd59"/>
    <text x="1322" y="473" text-anchor="middle" class="ach">Bellmar</text>
    <text x="1322" y="488" text-anchor="middle" class="achSmall">refuse growth</text>

    <rect x="1030" y="430" width="160" height="58" rx="10" fill="#1c2438" stroke="#475569"/>
    <text x="1110" y="452" text-anchor="middle" class="doc">Cycle Evidence</text>
    <text x="1110" y="470" text-anchor="middle" class="docSmall">PAT-2 / PAT-8 / PAT-10</text>

    <rect x="1220" y="430" width="152" height="58" rx="10" fill="#1c2438" stroke="#475569"/>
    <text x="1296" y="452" text-anchor="middle" class="doc">Erasure Records</text>
    <text x="1296" y="470" text-anchor="middle" class="docSmall">no active hint yet</text>
  </g>

  <g>
    <rect x="570" y="872" width="260" height="54" rx="16" fill="#ff8aa6"/>
    <text x="700" y="907" text-anchor="middle" class="group">ORIGINS</text>
    <path class="line" d="M700 872 L520 760"/>
    <path class="line" d="M700 872 L700 750"/>
    <path class="line" d="M700 872 L880 760"/>
    <path class="line" d="M700 872 L700 650"/>

    <rect x="416" y="720" width="208" height="58" rx="10" fill="#1c2438" stroke="#ffdd59"/>
    <text x="520" y="742" text-anchor="middle" class="doc">Aresty Research</text>
    <text x="520" y="760" text-anchor="middle" class="docSmall">ORI-1</text>
    <path class="hintLine" d="M520 720 C498 682 505 650 540 624"/>
    <rect x="476" y="576" width="128" height="48" rx="22" fill="#ffdd59"/>
    <text x="540" y="597" text-anchor="middle" class="ach">First Bite</text>
    <text x="540" y="612" text-anchor="middle" class="achSmall">begin alive</text>

    <rect x="622" y="706" width="156" height="58" rx="10" fill="#1c2438" stroke="#475569"/>
    <text x="700" y="728" text-anchor="middle" class="doc">Noise Floor</text>
    <text x="700" y="746" text-anchor="middle" class="docSmall">ORI-2 / ORI-5</text>

    <rect x="790" y="720" width="180" height="58" rx="10" fill="#1c2438" stroke="#ffdd59"/>
    <text x="880" y="742" text-anchor="middle" class="doc">Monastery Rule</text>
    <text x="880" y="760" text-anchor="middle" class="docSmall">ORI-6</text>
    <path class="hintLine" d="M880 720 C910 680 910 646 884 620"/>
    <rect x="824" y="572" width="120" height="48" rx="22" fill="#ffdd59"/>
    <text x="884" y="593" text-anchor="middle" class="ach">Quiet Bite</text>
    <text x="884" y="608" text-anchor="middle" class="achSmall">The Quiet</text>

    <rect x="620" y="620" width="160" height="58" rx="10" fill="#1c2438" stroke="#475569"/>
    <text x="700" y="642" text-anchor="middle" class="doc">Final Fragment</text>
    <text x="700" y="660" text-anchor="middle" class="docSmall">ORI-8</text>
  </g>

  <g>
    <rect x="454" y="118" width="492" height="70" rx="18" fill="#111827" stroke="#475569"/>
    <text x="700" y="145" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="900" fill="#fff">Starter Field Patterns</text>
    <text x="700" y="168" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" fill="#aab5c8">Parallax Courier, Mass Receipt, and Everyone's Friend are visible in the Archive from the start.</text>
  </g>
</svg>
