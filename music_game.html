<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Music Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; touch-action: none; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, lineY;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    lineY = H / 2;
    drawScene();
  }

  // ── Drawing ────────────────────────────────────────────────────────────────

  function drawLine(glowScale = 1) {
    const color = `rgba(0, 212, 255, ${Math.min(1, glowScale)})`;

    // Outer wide glow
    ctx.save();
    ctx.shadowBlur  = 48 * glowScale;
    ctx.shadowColor = '#00d4ff';
    ctx.strokeStyle = color;
    ctx.lineWidth   = 2;
    ctx.beginPath();
    ctx.moveTo(0,  lineY);
    ctx.lineTo(W, lineY);
    ctx.stroke();

    // Mid glow
    ctx.shadowBlur  = 20 * glowScale;
    ctx.shadowColor = '#00eaff';
    ctx.strokeStyle = '#00eaff';
    ctx.lineWidth   = 2;
    ctx.beginPath();
    ctx.moveTo(0,  lineY);
    ctx.lineTo(W, lineY);
    ctx.stroke();

    // Bright core
    ctx.shadowBlur  = 8 * glowScale;
    ctx.shadowColor = '#ffffff';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth   = 1.5;
    ctx.beginPath();
    ctx.moveTo(0,  lineY);
    ctx.lineTo(W, lineY);
    ctx.stroke();

    ctx.restore();
  }

  function drawScene(glowScale = 1) {
    ctx.clearRect(0, 0, W, H);
    drawLine(glowScale);
  }

  // ── Pulse animation ─────────────────────────────────────────────────────

  let animId = null;

  function pulse() {
    if (animId) cancelAnimationFrame(animId);
    const duration = 600; // ms
    const start    = performance.now();

    function step(now) {
      const t = Math.min(1, (now - start) / duration);
      // Ease out: sharp peak then decay back to 1
      const scale = 1 + 3 * Math.pow(1 - t, 2);
      drawScene(scale);
      if (t < 1) {
        animId = requestAnimationFrame(step);
      } else {
        animId = null;
        drawScene(1);
      }
    }
    animId = requestAnimationFrame(step);
  }

  // ── Audio ────────────────────────────────────────────────────────────────

  let audioCtx = null;

  function getAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
  }

  function playNote() {
    const ac  = getAudioCtx();
    const now = ac.currentTime;

    // Main tone — sine with a touch of detune for warmth
    function makeTone(freq, gainAmt, detune = 0) {
      const osc  = ac.createOscillator();
      const gain = ac.createGain();
      osc.type            = 'sine';
      osc.frequency.value = freq;
      osc.detune.value    = detune;

      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(gainAmt, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.6);

      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start(now);
      osc.stop(now + 1.7);
    }

    // D4 fundamental + harmonics for a bell/string quality
    makeTone(293.66, 0.45,   0);   // D4  fundamental
    makeTone(587.33, 0.20,   4);   // D5  octave (slight detune)
    makeTone(880.00, 0.10,  -4);   // A5  fifth
    makeTone(1174.7, 0.05,   2);   // D6  2nd octave
  }

  // ── Input ────────────────────────────────────────────────────────────────

  const HIT_ZONE = 44; // px either side of the line

  function onTap(clientY) {
    if (Math.abs(clientY - lineY) <= HIT_ZONE) {
      playNote();
      pulse();
    }
  }

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    onTap(t.clientY);
  }, { passive: false });

  canvas.addEventListener('mousedown', e => {
    onTap(e.clientY);
  });

  // ── Init ─────────────────────────────────────────────────────────────────

  window.addEventListener('resize', resize);
  resize();
</script>
</body>
</html>
