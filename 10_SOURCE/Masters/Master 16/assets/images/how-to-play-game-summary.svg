<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2048" viewBox="0 0 1536 2048" role="img" aria-labelledby="title desc">
  <title id="title">How to Play Downtown Devour</title>
  <desc id="desc">A tall orange how-to-play graphic showing four steps: you are a hole, eat things, grow bigger, and watch out for enemies.</desc>
  <rect width="1536" height="2048" fill="#000"/>
  <rect x="48" width="1440" height="2048" fill="#ff8a00"/>

  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#101329" flood-opacity="0.34"/>
    </filter>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="12" refY="9" orient="auto">
      <path d="M2,2 L13,9 L2,16" fill="none" stroke="#0d1330" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g fill="#080d25" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="900">
    <text x="768" y="100" font-size="70">HOW TO PLAY</text>
    <text x="768" y="156" font-size="42">DOWNTOWN DEVOUR</text>
  </g>

  <path d="M1046 358 C1254 363 1220 560 1220 570" fill="none" stroke="#101329" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1008 922 C918 1070 768 1110 720 1184" fill="none" stroke="#101329" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M665 1282 C828 1280 887 1420 887 1468" fill="none" stroke="#101329" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="448" y="197" width="608" height="364" rx="30" fill="#171a32"/>
    <rect x="641" y="170" width="222" height="52" rx="26" fill="#ff5e8b"/>
    <text x="752" y="206" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900" fill="#fff" text-anchor="middle">STEP 1</text>
    <text x="752" y="309" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="900" fill="#ff9f43" text-anchor="middle">YOU ARE</text>
    <text x="752" y="360" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="900" fill="#fff" text-anchor="middle">A HOLE!</text>
    <ellipse cx="752" cy="443" rx="166" ry="43" fill="#5a4630"/>
    <ellipse cx="752" cy="439" rx="124" ry="28" fill="#05070f"/>
    <ellipse cx="713" cy="421" rx="29" ry="10" fill="#ffffff" opacity="0.12" transform="rotate(-18 713 421)"/>
    <ellipse cx="863" cy="352" rx="21" ry="11" fill="#2a184e" stroke="#9b7aff" stroke-width="2"/>
    <text x="752" y="532" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#b6b8c4" text-anchor="middle">Move around the city</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="866" y="575" width="522" height="364" rx="30" fill="#171a32"/>
    <rect x="1009" y="548" width="224" height="52" rx="26" fill="#ffa345"/>
    <text x="1121" y="583" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900" fill="#11172d" text-anchor="middle">STEP 2</text>
    <text x="1127" y="642" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#ff9f43" text-anchor="middle">EAT THINGS</text>
    <text x="1127" y="685" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="900" fill="#fff" text-anchor="middle">IN THE WORLD!</text>
    <text x="906" y="714" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#ffd166">*</text>
    <text x="1198" y="714" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#ffd166">*</text>
    <rect x="973" y="745" width="76" height="22" rx="5" fill="#a88325" transform="rotate(14 1011 756)"/>
    <rect x="999" y="766" width="11" height="40" rx="3" fill="#4b3721" transform="rotate(14 1005 786)"/>
    <rect x="1082" y="711" width="78" height="54" rx="10" fill="#e84a3c" transform="rotate(-25 1121 738)"/>
    <circle cx="1094" cy="769" r="11" fill="#e84a3c"/>
    <circle cx="1149" cy="769" r="11" fill="#e84a3c"/>
    <ellipse cx="1127" cy="812" rx="86" ry="23" fill="#05070f"/>
    <ellipse cx="1127" cy="809" rx="70" ry="17" fill="#15182d"/>
    <text x="1127" y="906" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#b6b8c4" text-anchor="middle">Cars, benches, people...</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="118" y="1074" width="548" height="392" rx="30" fill="#171a32"/>
    <rect x="260" y="1048" width="230" height="52" rx="26" fill="#ff5e8b"/>
    <text x="375" y="1084" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900" fill="#fff" text-anchor="middle">STEP 3</text>
    <text x="379" y="1142" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#ff9f43" text-anchor="middle">EAT MORE =</text>
    <text x="379" y="1188" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="900" fill="#fff" text-anchor="middle">GROW BIGGER!</text>
    <circle cx="309" cy="1232" r="27" fill="#27ae60"/>
    <rect x="300" y="1255" width="14" height="38" rx="2" fill="#6b4a16" transform="rotate(20 307 1274)"/>
    <rect x="395" y="1198" width="70" height="92" rx="6" fill="#5ba1e8" transform="rotate(-14 430 1244)"/>
    <g fill="#d7ecff" transform="rotate(-14 430 1244)">
      <rect x="407" y="1216" width="16" height="16" rx="2"/>
      <rect x="438" y="1216" width="16" height="16" rx="2"/>
      <rect x="407" y="1247" width="16" height="16" rx="2"/>
      <rect x="438" y="1247" width="16" height="16" rx="2"/>
    </g>
    <text x="500" y="1249" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#ffd166">*</text>
    <ellipse cx="379" cy="1327" rx="150" ry="38" fill="#05070f"/>
    <ellipse cx="379" cy="1322" rx="117" ry="25" fill="#15182d"/>
    <text x="379" y="1433" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#b6b8c4" text-anchor="middle">The bigger you get,</text>
    <text x="379" y="1461" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#b6b8c4" text-anchor="middle">the more you can eat!</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="456" y="1587" width="624" height="372" rx="30" fill="#171a32" stroke="#ff5e8b" stroke-width="7"/>
    <rect x="649" y="1558" width="238" height="52" rx="26" fill="#f50d19"/>
    <text x="768" y="1594" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900" fill="#fff" text-anchor="middle">WATCH OUT!</text>
    <text x="768" y="1654" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#ff5e8b" text-anchor="middle">ENEMIES CAN</text>
    <text x="768" y="1695" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#fff" text-anchor="middle">STOP YOU!</text>
    <text x="917" y="1690" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900" fill="#fff" text-anchor="middle">!</text>

    <g transform="translate(575 1740)">
      <circle cx="0" cy="0" r="24" fill="#ffd38a"/>
      <path d="M-24 -5 Q0 -34 24 -5 Z" fill="#15a752"/>
      <rect x="-20" y="22" width="40" height="87" rx="8" fill="#24c96b"/>
      <rect x="-16" y="109" width="14" height="39" rx="3" fill="#245f40"/>
      <rect x="4" y="109" width="14" height="39" rx="3" fill="#245f40"/>
      <rect x="-17" y="145" width="17" height="8" rx="3" fill="#3d4548"/>
      <rect x="4" y="145" width="17" height="8" rx="3" fill="#3d4548"/>
    </g>
    <g transform="translate(666 1740)">
      <circle cx="0" cy="0" r="24" fill="#ffd38a"/>
      <path d="M-24 -5 Q0 -34 24 -5 Z" fill="#15a752"/>
      <rect x="-20" y="22" width="40" height="87" rx="8" fill="#24c96b"/>
      <rect x="-16" y="109" width="14" height="39" rx="3" fill="#245f40"/>
      <rect x="4" y="109" width="14" height="39" rx="3" fill="#245f40"/>
      <rect x="-17" y="145" width="17" height="8" rx="3" fill="#3d4548"/>
      <rect x="4" y="145" width="17" height="8" rx="3" fill="#3d4548"/>
    </g>
    <path d="M642 1815 C675 1804 707 1796 735 1788" fill="none" stroke="#333642" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="909" cy="1813" rx="70" ry="24" fill="#05070f"/>
    <ellipse cx="909" cy="1808" rx="53" ry="16" fill="#8b080e"/>
    <text x="909" y="1775" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#ff5e8b" text-anchor="middle">ENEMY</text>
    <text x="909" y="1805" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#ff5e8b" text-anchor="middle">HOLE</text>
    <path d="M1015 1749 L1040 1798 L990 1798 Z" fill="#ffd166"/>
    <rect x="1013" y="1764" width="6" height="22" rx="3" fill="#6d5421"/>
    <circle cx="1016" cy="1792" r="4" fill="#6d5421"/>
    <text x="768" y="1928" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="900" fill="#ff5e8b" text-anchor="middle">They can slow you down or eat YOU!</text>
  </g>

  <g>
    <rect x="179" y="1969" width="1178" height="37" rx="6" fill="#a9620f"/>
    <text x="768" y="1996" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#fff" text-anchor="middle">GROW THE BIGGEST HOLE TO WIN!</text>
  </g>
</svg>
