<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1184 1536" role="img" aria-labelledby="title desc">
  <title id="title">How to Play Downtown Devour</title>
  <desc id="desc">A simple four-step summary: you are a hole, eat things, grow bigger, and watch out for enemies.</desc>
  <rect width="1184" height="1536" fill="#ff8a00"/>
  <g fill="#080d25" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="900">
    <text x="592" y="92" font-size="58">HOW TO PLAY</text>
    <text x="592" y="142" font-size="36">DOWNTOWN DEVOUR</text>
  </g>

  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#101329" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="11" refY="8" orient="auto">
      <path d="M2,2 L12,8 L2,14" fill="none" stroke="#0d1330" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <path d="M870 296 C1032 300 1006 482 1006 492" fill="none" stroke="#101329" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M835 690 C754 816 628 858 588 912" fill="none" stroke="#101329" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M494 1110 C665 1110 707 1235 707 1284" fill="none" stroke="#101329" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="334" y="182" width="516" height="344" rx="28" fill="#171a32"/>
    <rect x="493" y="158" width="198" height="50" rx="25" fill="#ff5e8b"/>
    <text x="592" y="192" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#fff" text-anchor="middle">STEP 1</text>
    <text x="592" y="286" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="900" fill="#ff9f43" text-anchor="middle">YOU ARE</text>
    <text x="592" y="332" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#fff" text-anchor="middle">A HOLE!</text>
    <ellipse cx="592" cy="405" rx="155" ry="38" fill="#5a4630"/>
    <ellipse cx="592" cy="402" rx="111" ry="26" fill="#05070f"/>
    <ellipse cx="558" cy="387" rx="25" ry="9" fill="#ffffff" opacity="0.12" transform="rotate(-18 558 387)"/>
    <ellipse cx="685" cy="326" rx="18" ry="10" fill="#2a184e" stroke="#9b7aff" stroke-width="2"/>
    <text x="592" y="494" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#b6b8c4" text-anchor="middle">Move around the city</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="680" y="540" width="438" height="344" rx="28" fill="#171a32"/>
    <rect x="802" y="516" width="188" height="50" rx="25" fill="#ffa345"/>
    <text x="896" y="550" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#11172d" text-anchor="middle">STEP 2</text>
    <text x="899" y="606" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#ff9f43" text-anchor="middle">EAT THINGS</text>
    <text x="899" y="646" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="900" fill="#fff" text-anchor="middle">IN THE WORLD!</text>
    <rect x="798" y="696" width="64" height="20" rx="5" fill="#a88325" transform="rotate(14 830 706)"/>
    <rect x="821" y="715" width="10" height="36" rx="3" fill="#4b3721" transform="rotate(14 826 733)"/>
    <rect x="868" y="668" width="72" height="48" rx="9" fill="#e84a3c" transform="rotate(-25 904 692)"/>
    <circle cx="882" cy="719" r="10" fill="#e84a3c"/>
    <circle cx="930" cy="719" r="10" fill="#e84a3c"/>
    <ellipse cx="899" cy="763" rx="72" ry="20" fill="#05070f"/>
    <ellipse cx="899" cy="760" rx="60" ry="15" fill="#15182d"/>
    <text x="899" y="853" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#b6b8c4" text-anchor="middle">Cars, benches, people...</text>
    <text x="724" y="670" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#ffd166">*</text>
    <text x="960" y="673" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#ffd166">*</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="90" y="1011" width="440" height="368" rx="28" fill="#171a32"/>
    <rect x="207" y="986" width="188" height="50" rx="25" fill="#ff5e8b"/>
    <text x="301" y="1020" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#fff" text-anchor="middle">STEP 3</text>
    <text x="310" y="1074" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="900" fill="#ff9f43" text-anchor="middle">EAT MORE =</text>
    <text x="310" y="1116" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="900" fill="#fff" text-anchor="middle">GROW BIGGER!</text>
    <circle cx="252" cy="1161" r="23" fill="#27ae60"/>
    <rect x="244" y="1180" width="13" height="34" rx="2" fill="#6b4a16" transform="rotate(20 250 1197)"/>
    <rect x="326" y="1126" width="62" height="82" rx="6" fill="#5ba1e8" transform="rotate(-14 357 1167)"/>
    <g fill="#d7ecff" transform="rotate(-14 357 1167)">
      <rect x="337" y="1142" width="14" height="14" rx="2"/>
      <rect x="364" y="1142" width="14" height="14" rx="2"/>
      <rect x="337" y="1169" width="14" height="14" rx="2"/>
      <rect x="364" y="1169" width="14" height="14" rx="2"/>
    </g>
    <ellipse cx="310" cy="1248" rx="122" ry="34" fill="#05070f"/>
    <ellipse cx="310" cy="1244" rx="95" ry="22" fill="#15182d"/>
    <text x="310" y="1347" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#b6b8c4" text-anchor="middle">The bigger you get,</text>
    <text x="310" y="1372" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#b6b8c4" text-anchor="middle">the more you can eat!</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="334" y="1458" width="516" height="78" rx="22" fill="#171a32" stroke="#ff5e8b" stroke-width="5"/>
    <rect x="493" y="1428" width="198" height="48" rx="24" fill="#f50d19"/>
    <text x="592" y="1461" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#fff" text-anchor="middle">WATCH OUT!</text>
    <text x="592" y="1512" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="900" fill="#ff5e8b" text-anchor="middle">ENEMIES CAN STOP YOU!</text>
  </g>

  <g>
    <rect x="130" y="1474" width="924" height="34" rx="6" fill="#a9620f"/>
    <text x="592" y="1499" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#fff" text-anchor="middle">GROW THE BIGGEST HOLE TO WIN!</text>
  </g>
</svg>
